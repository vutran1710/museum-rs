<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" role="img" aria-label="A release pipeline uploads executables and then the index to a repository; a host reads the index, resolves one version for its target, downloads it, checks its sha256 and installs it.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1f4a"/>
    </marker>
  </defs>
  <rect width="920" height="330" rx="16" fill="#ffffff" stroke="#d7dbe8"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1c1f4a">
    <!-- column titles -->
    <g font-size="13" font-weight="700" fill="#6b7190" letter-spacing="0.5">
      <text x="110" y="38" text-anchor="middle">RELEASE PIPELINE</text>
      <text x="455" y="38" text-anchor="middle">REPOSITORY (OR ANY STORE)</text>
      <text x="785" y="38" text-anchor="middle">HOST PROGRAM</text>
    </g>

    <!-- publisher -->
    <rect x="30" y="120" width="160" height="80" rx="10" fill="#1c1f4a"/>
    <text x="110" y="155" text-anchor="middle" font-size="15" font-weight="700" fill="#f2c45a">museum publish</text>
    <text x="110" y="177" text-anchor="middle" font-size="12" fill="#e9ecff">your built files</text>

    <!-- store: index -->
    <rect x="330" y="62" width="250" height="100" rx="10" fill="#fff8e6" stroke="#f2c45a" stroke-width="2"/>
    <text x="345" y="86" font-size="14" font-weight="700">index.json</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#3a3f63">
      <text x="345" y="109">modbus 0.4.2  interface 2</text>
      <text x="361" y="128">x86_64-linux  sha256 9f2c…</text>
      <text x="361" y="147">windows-msvc  sha256 41ab…</text>
    </g>

    <!-- store: executables -->
    <rect x="330" y="190" width="250" height="100" rx="10" fill="#eef0fb" stroke="#9aa1c7" stroke-width="2"/>
    <text x="345" y="214" font-size="14" font-weight="700">release modbus-v0.4.2</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#3a3f63">
      <text x="345" y="237">modbus-0.4.2-x86_64-linux</text>
      <text x="345" y="256">modbus-0.4.2-windows-msvc.exe</text>
      <text x="345" y="275">…one file per target</text>
    </g>

    <!-- publisher arrows -->
    <path d="M190,180 C260,180 260,240 326,240" fill="none" stroke="#1c1f4a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="236" y="236" text-anchor="middle" font-size="12">① upload</text>
    <path d="M190,140 C260,140 260,112 326,112" fill="none" stroke="#1c1f4a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="236" y="112" text-anchor="middle" font-size="12">② write last</text>

    <!-- host -->
    <rect x="680" y="62" width="210" height="228" rx="10" fill="#1c1f4a"/>
    <text x="785" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#f2c45a">Registry</text>
    <g font-size="12.5" fill="#e9ecff">
      <text x="698" y="122">1  read the index</text>
      <text x="698" y="152">2  resolve ^0.4 → 0.4.2</text>
      <text x="714" y="168" fill="#9aa1c7">for this target + interface</text>
      <text x="698" y="198">3  stream, check sha256</text>
      <text x="698" y="228">4  install atomically</text>
      <text x="714" y="244" fill="#9aa1c7">drivers/modbus-0.4.2</text>
    </g>

    <!-- host arrows -->
    <line x1="580" y1="112" x2="676" y2="118" stroke="#1c1f4a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="628" y="104" text-anchor="middle" font-size="12">read</text>
    <line x1="580" y1="240" x2="676" y2="200" stroke="#1c1f4a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="628" y="240" text-anchor="middle" font-size="12">download</text>

    <text x="455" y="315" text-anchor="middle" font-size="12" fill="#6b7190">Executables go up first and the index last, so a host never sees an entry whose file is missing.</text>
  </g>
</svg>
