# Releases museum when a `v<version>` tag is pushed: the same checks as local development, then the
# crates on crates.io and prebuilt `museum` binaries on the GitHub release. Run it by hand to try the
# checks; give it a `tag` to (re)build and attach the binaries of an existing release.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries for, e.g. v0.2.0 (crates are not republished)"
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --fail-under-lines 100

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, quality]
    runs-on: ubuntu-latest
    environment: CARGO_REGISTRY_TOKEN
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches both crate versions
        run: |
          tag="${TAG#v}"
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | "\(.name) \(.version)"' \
            | while read -r name version; do
                if [ "$version" != "$tag" ]; then
                  echo "::error::$name is $version but the tag is v$tag"
                  exit 1
                fi
              done
      - run: cargo publish -p museum
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p museum-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  binaries:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [test, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, archive: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, archive: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p museum-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          name="museum-$TAG-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/museum$([ "${{ runner.os }}" = Windows ] && echo .exe)" README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            (cd "$name" && 7z a "../$name.zip" . > /dev/null)
          else
            tar -C "$name" -czf "$name.tar.gz" .
          fi
          shasum -a 256 "$name.${{ matrix.archive }}" > "$name.${{ matrix.archive }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: museum-${{ matrix.target }}
          path: museum-${{ env.TAG }}-${{ matrix.target }}.*

  release:
    needs: [binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber
