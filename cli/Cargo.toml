[package]
name = "museum-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Start a museum registry and publish signed executables into it"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vutran1710/museum-rs"
readme = "../README.md"
keywords = ["registry", "plugins", "minisign", "publish", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "museum"
path = "src/main.rs"

[dependencies]
# the registry itself, with the GitHub stores and every built-in index
museum = { path = "..", version = "0.1.0", features = ["github", "json", "yaml", "toml"] }
# argument parsing
clap = { version = "4", features = ["derive", "env"] }
# async runtime for the registry calls
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# museum.toml (de)serialisation
serde = { version = "1", features = ["derive"] }
# museum.toml format
toml = "0.9"
# generating and loading the publisher's signing key
minisign = "0.7"

[dev-dependencies]
# parameterised test rows
rstest = "0.26"
# local server standing in for the GitHub API
wiremock = "0.6"
# throwaway config, key and build directories
tempfile = "3"
# async test runtime
tokio = { version = "1", features = ["full"] }
# fake GitHub API payloads
serde_json = "1"
# decoding files committed through the fake contents API
base64 = "0.22"

[lints]
workspace = true
